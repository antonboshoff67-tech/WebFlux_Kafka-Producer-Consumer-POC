# ---------------------------------------------------------------------------
# Full stack: MySQL + Kafka (KRaft) + the item-kafka-producer-poc backend,
# all in Docker. See DEVELOPER_GUIDE.md, "Running everything in Docker" for a
# full step-by-step walkthrough (including how to seed the databases and how
# to test each endpoint).
#
# Usage:
#   docker compose -f docker-compose.full.yml up -d --build
#   docker compose -f docker-compose.full.yml logs -f backend
#   docker compose -f docker-compose.full.yml down          # stop
#   docker compose -f docker-compose.full.yml down -v       # stop + wipe all data
# ---------------------------------------------------------------------------
services:
  mysql:
    image: mysql:8.0
    container_name: item-mysql
    restart: unless-stopped
    # Linux MySQL defaults to case-SENSITIVE table names (lower_case_table_names=0),
    # unlike Windows (case-insensitive by default). Force case-insensitive
    # comparison here so Hibernate's lowercased "item" and the seed scripts'
    # uppercase "ITEM" always refer to the same table, matching native/Windows
    # behaviour and avoiding a silent "empty table" surprise on Linux hosts/CI.
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: Password@1
    ports:
      - "3306:3306"
    volumes:
      - item-mysql-data:/var/lib/mysql
      # Every .sql file here runs automatically, in name order, the FIRST
      # time the container starts (i.e. against an empty data volume).
      - ./sql-scripts/02_mysql_item_source_seed_200.sql:/docker-entrypoint-initdb.d/02_source_seed.sql:ro
      - ./sql-scripts/03_mysql_item_sink_and_consumed_tables.sql:/docker-entrypoint-initdb.d/03_sink_tables.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pPassword@1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: item-kafka-broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: r1hx1UXURDGCx1_88Uyikg
    volumes:
      - item-kafka-data:/var/lib/kafka/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: item-kafka-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      # Source table (defaults to MySQL - see application.yml). Uses the
      # Docker service name "mysql" instead of localhost since containers
      # resolve each other by service name on the compose network.
      ITEM_MSSQL_URL: jdbc:mysql://mysql:3306/item_poc_source?useSSL=false&allowPublicKeyRetrieval=true
      ITEM_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      ITEM_MSSQL_USERNAME: root
      ITEM_MSSQL_PASSWORD: Password@1
      # Sink database written to by Flink Job 2.
      ITEM_MYSQL_URL: jdbc:mysql://mysql:3306/item_poc?useSSL=false&allowPublicKeyRetrieval=true
      ITEM_MYSQL_USERNAME: root
      ITEM_MYSQL_PASSWORD: Password@1
      ITEM_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ITEM_KAFKA_TOPIC: Item_Topic
      # Allow the React UI (running on the host, not in this compose file)
      # to call the backend across origins.
      ITEM_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080

volumes:
  item-mysql-data:
  item-kafka-data:

