apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webflux-kafka-backend-hpa
  namespace: webflux-kafka-poc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webflux-kafka-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70


