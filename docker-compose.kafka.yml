# Local Kafka broker (KRaft mode, no Zookeeper needed) for
# ConfluentCloud_Kafka-Producer-Consumer-POC. This is a convenience file for local
# development/testing only - not required if you already have Kafka installed
# (see KAFKA_SETUP.md for the manual install instructions).
#
# Usage:
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka.yml down          # stop
#   docker compose -f docker-compose.kafka.yml down -v       # stop + wipe data
#
# Then create the topic used by this project:
#   docker exec item-kafka-broker kafka-topics.sh --bootstrap-server localhost:9092 --create --topic Item_Topic --partitions 1 --replication-factor 1
#
# Verify:
#   docker exec item-kafka-broker kafka-topics.sh --bootstrap-server localhost:9092 --list
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: item-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: r1hx1UXURDGCx1_88Uyikg
    volumes:
      - item-kafka-data:/var/lib/kafka/data

volumes:
  item-kafka-data:

